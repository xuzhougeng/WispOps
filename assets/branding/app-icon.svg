<!-- 本项目绘制: three servers in ink with their lamps lit, one linked out to a node, in
     Wisp Science's colours (its tile, its teal, the node and link of its wordmark). The tile leaves
     a 10% transparent margin on each side, as macOS icons do; the .ico is rendered from the same
     drawing with viewBox="-4 -4 136 136". `app-mark.svg` is the same picture for small sizes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-16 -16 160 160">
  <rect width="128" height="128" rx="26" fill="#FAF9F6"/>
  <!-- the servers -->
  <rect x="24" y="31" width="62" height="19" rx="6.5" fill="none" stroke="#1C1C1C" stroke-width="3.6"/>
  <circle cx="35.5" cy="40.5" r="3.4" fill="#0D9488"/>
  <path d="M62 40.5h13" stroke="#1C1C1C" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <rect x="24" y="54.5" width="62" height="19" rx="6.5" fill="none" stroke="#1C1C1C" stroke-width="3.6"/>
  <circle cx="35.5" cy="64.0" r="3.4" fill="#0D9488"/>
  <path d="M62 64.0h13" stroke="#1C1C1C" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <rect x="24" y="78" width="62" height="19" rx="6.5" fill="none" stroke="#1C1C1C" stroke-width="3.6"/>
  <circle cx="35.5" cy="87.5" r="3.4" fill="#0D9488"/>
  <path d="M62 87.5h13" stroke="#1C1C1C" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <!-- the node -->
  <path d="M86 40.5L99.8 29.1" stroke="#0D9488" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="106" cy="24" r="8" fill="#FAF9F6" stroke="#0D9488" stroke-width="2.6"/>
</svg>
