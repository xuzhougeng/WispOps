[package]
name = "wisp_ops"
version = "0.3.0"
edition = "2024"
description = "An AI-native server operations desk drawn with GPUI: a fleet of SSH hosts, inspections, diagnosis and changes, each gated per host"
license = "MIT"

# `wisp_ops_engine` is the GPUI-free operations engine (inventory, SSH, permissions, vault, audit),
# `wisp_ops_collect` the read-only collectors (scripts and their parsers), `wisp_ops_core` the
# agent's protocol and settings, `wisp_ops_net` its HTTP.
[workspace]
members = ["crates/core", "crates/net", "crates/engine", "crates/collect"]
default-members = [".", "crates/core", "crates/net", "crates/engine", "crates/collect"]

[dependencies]
regex = "1"
wisp_ops_core = { path = "crates/core" }
wisp_ops_net = { path = "crates/net" }
wisp_ops_engine = { path = "crates/engine" }
wisp_ops_collect = { path = "crates/collect" }
anyhow = "1"
dirs = "7"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-segmentation = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Debug builds write the window to a picture (`WISP_OPS_DEV=…,shot:file.png`).
image = { version = "0.25", default-features = false, features = ["png"] }

# GPUI 0.2.2 / taffy 0.9.0 / xattr 0.2.3 with the quiet-md patches (Windows
# IME, CJK line breaking, …); see vendor/PATCHES.md.
# Without Xcode's Metal Toolchain the shaders cannot be compiled at build time:
# `cargo run --features runtime_shaders` compiles them when the app starts.
[features]
runtime_shaders = ["gpui/runtime_shaders"]

[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }
xattr = { path = "vendor/xattr" }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

[lints]
workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Holding off App Nap while the program works unseen (src/background.rs); the version GPUI uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
