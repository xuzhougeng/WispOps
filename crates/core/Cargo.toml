[package]
name = "wisp_ops_core"
version = "0.4.0"
edition = "2024"
description = "WispOps's assistant engine: model providers, request bodies and stream parsing, settings, skills, Markdown. No GPUI."
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
icu_segmenter = "2"

[lints]
workspace = true
